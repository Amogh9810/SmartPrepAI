[project]
name = "smartprep-ai-backend"
version = "1.0.0"
description = "FastAPI backend for SmartPrep AI - AI-powered study platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "httpx==0.25.0",
    "python-multipart==0.0.6",
    "easyocr==1.7.0",
    "spacy==3.7.2",
    "pillow==10.0.0",
    "numpy==1.24.3",
    "scikit-learn==1.3.0",
    "pandas==2.0.0",
    "supabase==2.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smartprep"]
